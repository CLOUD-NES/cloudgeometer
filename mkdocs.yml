site_name: cloudgeometer
site_url: https://cloud-nes.github.io/cloudgeometer/
repo_url: https://github.com/CLOUD-NES/cloudgeometer
theme:
  name: material
  logo: logo/logo.png
nav:
  - Home: index.md
  - API: api.md
  - Contributing: contributing.md
  - Code of Conduct: code_of_conduct.md
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
